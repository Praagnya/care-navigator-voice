<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Care Navigator Voice</title>
  <style>
    body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; background: #f5f5f5; }
    button { padding: 16px 32px; font-size: 18px; border-radius: 8px; border: none; cursor: pointer; margin: 8px; }
    #startBtn { background: #4CAF50; color: white; }
    #stopBtn  { background: #f44336; color: white; display: none; }
    #status   { margin-top: 16px; font-size: 14px; color: #555; }
  </style>
</head>
<body>
  <h1>Care Navigator</h1>
  <button id="startBtn">Start</button>
  <button id="stopBtn">Stop</button>
  <p id="status">Press Start to begin</p>

  <script>
    const WS_URL = "ws://localhost:8000/voice";
    const SAMPLE_RATE = 16000;

    let ws, audioCtx, mediaStream, workletNode;
    let playbackCtx = null;
    let nextPlayTime = 0;
    let scheduledSources = [];
    let interrupted = false;

    document.getElementById("startBtn").onclick = async () => {
      document.getElementById("startBtn").style.display = "none";
      document.getElementById("stopBtn").style.display = "inline-block";
      document.getElementById("status").textContent = "Connecting...";

      playbackCtx = new AudioContext({ sampleRate: 24000 });
      nextPlayTime = 0;

      ws = new WebSocket(WS_URL);
      ws.binaryType = "arraybuffer";

      ws.onopen = () => {
        document.getElementById("status").textContent = "Connected — speak now";
        startMic();
      };

      ws.onmessage = (event) => {
        // Handle control signals
        if (event.data === "__turn_complete__") {
            interrupted = false;
            return;
        }
        if (event.data === "__interrupted__") {
            interrupted = true;
            if (playbackCtx && playbackCtx.state !== "closed") {
                playbackCtx.close();
                playbackCtx = null;
            }
            nextPlayTime = 0;
            scheduledSources = [];
            return;
        }
        // Drop audio chunks that arrived after interruption
        if (interrupted) return;
        // Recreate playbackCtx if needed
        if (!playbackCtx || playbackCtx.state === "closed") {
            playbackCtx = new AudioContext({ sampleRate: 24000 });
            nextPlayTime = 0;
        }
        // Play received PCM audio (24kHz, 16-bit, mono) — queued gaplessly
        const pcm = new Int16Array(event.data);
        const float32 = new Float32Array(pcm.length);
        for (let i = 0; i < pcm.length; i++) float32[i] = pcm[i] / 32768.0;

        const buffer = playbackCtx.createBuffer(1, float32.length, 24000);
        buffer.copyToChannel(float32, 0);
        const source = playbackCtx.createBufferSource();
        source.buffer = buffer;
        source.connect(playbackCtx.destination);

        const now = playbackCtx.currentTime;
        const startAt = Math.max(now, nextPlayTime);
        source.start(startAt);
        nextPlayTime = startAt + buffer.duration;
        scheduledSources.push(source);
      };

      ws.onclose = () => {
        document.getElementById("status").textContent = "Disconnected";
        stop();
      };

      ws.onerror = () => {
        document.getElementById("status").textContent = "WebSocket error";
        stop();
      };
    };

    document.getElementById("stopBtn").onclick = stop;

    async function startMic() {
      mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
      audioCtx = new AudioContext({ sampleRate: SAMPLE_RATE });

      await audioCtx.audioWorklet.addModule("recorder.js");
      const source = audioCtx.createMediaStreamSource(mediaStream);
      workletNode = new AudioWorkletNode(audioCtx, "recorder");

      workletNode.port.onmessage = (e) => {
        if (ws && ws.readyState === WebSocket.OPEN) {
          ws.send(e.data); // raw PCM bytes
        }
      };

      source.connect(workletNode);
      workletNode.connect(audioCtx.destination);
    }

    function stop() {
      if (workletNode) { workletNode.disconnect(); workletNode = null; }
      if (mediaStream) { mediaStream.getTracks().forEach(t => t.stop()); mediaStream = null; }
      if (audioCtx && audioCtx.state !== "closed") { audioCtx.close(); audioCtx = null; }
      if (playbackCtx && playbackCtx.state !== "closed") { playbackCtx.close(); playbackCtx = null; }
      if (ws) { ws.close(); ws = null; }
      nextPlayTime = 0;
      document.getElementById("startBtn").style.display = "inline-block";
      document.getElementById("stopBtn").style.display = "none";
    }
  </script>
</body>
</html>
